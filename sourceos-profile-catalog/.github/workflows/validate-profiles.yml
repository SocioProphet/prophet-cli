name: validate-profiles
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m json.tool examples/experience-profile.mac-like.json >/dev/null
      - run: python -m json.tool examples/experience-profile.windows-like.json >/dev/null
