[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prophet-cli"
version = "0.1.0"
description = "Prophet platform CLI — infra, workspace, and dev tooling"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.scripts]
prophet = "prophet.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["prophet*"]
