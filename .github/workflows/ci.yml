name: ci

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, sourceos/rev2-1-facade-seed, scaffold3 ]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Download modules
        run: go mod tidy
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  vocab-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prophet-cli
        uses: actions/checkout@v4
      - name: Checkout standards repo
        uses: actions/checkout@v4
        with:
          repository: SocioProphet/socioprophet-standards-knowledge
          ref: main
          path: socioprophet-standards-knowledge
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validator dependencies
        run: python -m pip install --upgrade pip rdflib pyshacl
      - name: Run vocab validate against standards repo
        env:
          PROPHET_VOCAB_REPO: ./socioprophet-standards-knowledge
        run: |
          go mod tidy
          go run ./cmd/prophet vocab validate policy/shapes/master.shacl.ttl

  bindings-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prophet-cli
        uses: actions/checkout@v4
      - name: Checkout standards repo
        uses: actions/checkout@v4
        with:
          repository: SocioProphet/socioprophet-standards-knowledge
          ref: main
          path: socioprophet-standards-knowledge
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ABD validator dependencies
        run: python -m pip install --upgrade pip jsonschema rdflib pyshacl
      - name: Run bindings ABD validation against standards repo
        env:
          PROPHET_STANDARDS_REPO: ./socioprophet-standards-knowledge
        run: |
          go mod tidy
          go run ./cmd/prophet bindings validate abd --abd fixtures/semantic-core/abd/valid-port-socket.json

  k8s-shapecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prophet-cli
        uses: actions/checkout@v4
      - name: Checkout standards repo
        uses: actions/checkout@v4
        with:
          repository: SocioProphet/socioprophet-standards-knowledge
          ref: main
          path: socioprophet-standards-knowledge
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install K8s shapecheck dependencies
        run: python -m pip install --upgrade pip pyyaml rdflib pyshacl
      - name: Run K8s shapecheck against standards repo
        env:
          PROPHET_STANDARDS_REPO: ./socioprophet-standards-knowledge
        run: |
          go mod tidy
          go run ./cmd/prophet k8s shapecheck \
            fixtures/semantic-core/k8s/valid-nodeport-service.yaml \
            fixtures/semantic-core/k8s/valid-deployment-service-ingress.yaml \
            fixtures/semantic-core/k8s/valid-k3s-ingress.yaml \
            fixtures/semantic-core/k8s/valid-kubeedge-deployment.yaml
          (
            cd socioprophet-standards-knowledge
            python3 k8s/tools/check_scheduling.py --manifest fixtures/semantic-core/k8s/valid-kubeedge-toleration.yaml --json
            set +e
            python3 k8s/tools/check_scheduling.py --manifest fixtures/semantic-core/k8s/invalid-kubeedge-missing-toleration.yaml --json
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              exit 1
            fi
          )

  k8s-policy-samples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prophet-cli
        uses: actions/checkout@v4
      - name: Checkout standards repo
        uses: actions/checkout@v4
        with:
          repository: SocioProphet/socioprophet-standards-knowledge
          ref: main
          path: socioprophet-standards-knowledge
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install K8s shapecheck dependencies
        run: python -m pip install --upgrade pip pyyaml rdflib pyshacl
      - name: Run K8s policy samples
        env:
          PROPHET_STANDARDS_REPO: ./socioprophet-standards-knowledge
        run: |
          go mod tidy
          python - <<'PY' > /tmp/k8s-policy-samples.txt
          from pathlib import Path
          root = Path('socioprophet-standards-knowledge/fixtures/semantic-core/k8s')
          for item in sorted(root.glob('*.yaml')):
              if item.name.startswith('invalid-'):
                  print(item.relative_to('socioprophet-standards-knowledge'))
          PY
          while IFS= read -r fixture
          do
            set +e
            go run ./cmd/prophet k8s shapecheck "$fixture"
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              exit 1
            fi
          done < /tmp/k8s-policy-samples.txt
