name: ci

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, sourceos/rev2-1-facade-seed, scaffold3 ]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Download modules
        run: go mod tidy
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  vocab-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prophet-cli
        uses: actions/checkout@v4
      - name: Checkout standards repo
        uses: actions/checkout@v4
        with:
          repository: SocioProphet/socioprophet-standards-knowledge
          ref: main
          path: socioprophet-standards-knowledge
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validator dependencies
        run: python -m pip install --upgrade pip rdflib pyshacl
      - name: Run vocab validate against standards repo
        env:
          PROPHET_VOCAB_REPO: ./socioprophet-standards-knowledge
        run: |
          go mod tidy
          go run ./cmd/prophet vocab validate .

  bindings-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prophet-cli
        uses: actions/checkout@v4
      - name: Checkout standards repo
        uses: actions/checkout@v4
        with:
          repository: SocioProphet/socioprophet-standards-knowledge
          ref: main
          path: socioprophet-standards-knowledge
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ABD validator dependencies
        run: python -m pip install --upgrade pip jsonschema rdflib pyshacl
      - name: Create minimal ABD fixture
        run: |
          cat > /tmp/prophet-abd.json <<'JSON'
          {
            "apiVersion": "bindings.socioprophet.io/v0.1",
            "kind": "AgentBindingDescriptor",
            "metadata": {
              "name": "ci-smoke"
            },
            "bindings": [
              {
                "type": "port",
                "name": "http",
                "portNumber": 8080
              },
              {
                "type": "socket",
                "name": "runtime",
                "socketPath": "/run/prophet/runtime.sock"
              }
            ]
          }
          JSON
      - name: Run bindings ABD validation against standards repo
        env:
          PROPHET_STANDARDS_REPO: ./socioprophet-standards-knowledge
        run: |
          go mod tidy
          go run ./cmd/prophet bindings validate abd --abd /tmp/prophet-abd.json

  k8s-shapecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prophet-cli
        uses: actions/checkout@v4
      - name: Checkout standards repo
        uses: actions/checkout@v4
        with:
          repository: SocioProphet/socioprophet-standards-knowledge
          ref: main
          path: socioprophet-standards-knowledge
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install K8s shapecheck dependencies
        run: python -m pip install --upgrade pip pyyaml rdflib pyshacl
      - name: Create minimal K8s Service fixture
        run: |
          cat > /tmp/prophet-service.yaml <<'YAML'
          apiVersion: v1
          kind: Service
          metadata:
            name: prophet-ci
          spec:
            type: NodePort
            selector:
              app: prophet-ci
            ports:
              - name: http
                port: 80
                targetPort: 8080
                nodePort: 30080
          YAML
      - name: Run K8s shapecheck against standards repo
        env:
          PROPHET_STANDARDS_REPO: ./socioprophet-standards-knowledge
        run: |
          go mod tidy
          go run ./cmd/prophet k8s shapecheck /tmp/prophet-service.yaml
